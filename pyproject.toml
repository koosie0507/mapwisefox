[project]
name = "mapwisefox"
version = "0.9.2"
description = "Utilities for creating systematic literature reviews"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.14.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "assistant",
    "common-config",
    "deduplication",
    "metrics",
    "search",
    "snowballing",
    "split",
    "web/backend"
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "memray>=1.19.1",
    "mypy>=1.19",
    "pytest>=9.0",
    "pytest-cov>=7.1.0",
    "responses>=0.25",
    "ruff>=0.14",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-include-markdown-plugin>=6.2",
]

[tool.bumpversion]
current_version = "0.9.2"
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:-(?P<pre_label>[a-zA-Z-]+)(?P<pre_number>:0|[1-9]\\d*))?
"""
serialize = [
    "{major}.{minor}.{patch}-{pre_label}{pre_number}",
    "{major}.{minor}.{patch}",
]

search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump mapwisefox version: {current_version} → {new_version}"
allow_dirty = true
commit = true
message = "Bump mapwisefox version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = "version: {current_version}"
replace = "version: {new_version}"

[tool.bumpversion.parts.pre_label]
values = ["dev", "final"]
optional_value= "final"

[tool.bumpversion.parts.pre_number]
first_value = 1
